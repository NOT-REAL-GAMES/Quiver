name: macOS CI

on: [push, pull_request]

jobs:
  build-mac-os:
    name: Build macOS
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        configuration: [release, debug]
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: brew install sqlite cmake llvm molten-vk vulkan-headers glslang spirv-tools sdl2 libvorbis flac opus opusfile flac mpg123 meson
    - name: Build vkQuake
      run: |
        export CC="$(brew --prefix llvm)/bin/clang"
        export CXX="$(brew --prefix llvm)/bin/clang++"
        cmake -S Jolt/Build -B Jolt/Build/Linux_Distribution \
          -DCMAKE_BUILD_TYPE=Distribution -DCMAKE_CXX_COMPILER="$CXX" \
          -DENABLE_OBJECT_STREAM=OFF -DINTERPROCEDURAL_OPTIMIZATION=OFF -DENABLE_ALL_WARNINGS=OFF \
          -DTARGET_UNIT_TESTS=OFF -DTARGET_HELLO_WORLD=OFF \
          -DTARGET_PERFORMANCE_TEST=OFF -DTARGET_SAMPLES=OFF -DTARGET_VIEWER=OFF
        cmake --build Jolt/Build/Linux_Distribution --target Jolt --parallel
        export PKG_CONFIG_PATH="$(brew --prefix sqlite)/lib/pkgconfig:$PKG_CONFIG_PATH"
        meson build --buildtype=${{ matrix.configuration }} && ninja -C build
    - name: Upload vkQuake
      uses: actions/upload-artifact@v4
      with:
        name: vkQuake archive (${{ matrix.configuration }})
        path: build/vkquake
